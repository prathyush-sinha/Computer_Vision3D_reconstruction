<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="180" viewBox="0 0 1180 180">
  <style>
    .box { fill: #f7f7f7; stroke: #333; stroke-width: 1.5; rx: 10; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #333; stroke-width: 1.7; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  <rect class="box" x="20" y="60" width="130" height="60" />
  <text class="text" x="85" y="90">Images</text>
  <line class="arrow" x1="150" y1="90" x2="200" y2="90" />
  <rect class="box" x="200" y="60" width="150" height="60" />
  <text class="text" x="275" y="90">Feature extraction</text>
  <line class="arrow" x1="350" y1="90" x2="400" y2="90" />
  <rect class="box" x="400" y="60" width="140" height="60" />
  <text class="text" x="470" y="90">Matching</text>
  <line class="arrow" x1="540" y1="90" x2="590" y2="90" />
  <rect class="box" x="590" y="60" width="170" height="60" />
  <text class="text" x="675" y="90">Geometric verify</text>
  <line class="arrow" x1="760" y1="90" x2="810" y2="90" />
  <rect class="box" x="810" y="60" width="140" height="60" />
  <text class="text" x="880" y="90">COLMAP / SfM</text>
  <line class="arrow" x1="950" y1="90" x2="1000" y2="90" />
  <rect class="box" x="1000" y="60" width="160" height="60" />
  <text class="text" x="1080" y="90">Sparse 3D model</text>
</svg>
